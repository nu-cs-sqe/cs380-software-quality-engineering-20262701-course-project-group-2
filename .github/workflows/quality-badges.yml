name: Quality badges

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate complexity badge data
        run: ./gradlew complexityBadge -x pitest

      - name: Render complexity badge
        run: |
          curl -fsSL -G "https://img.shields.io/static/v1" \
            --data-urlencode "label=$(jq -r .label build/badges/complexity.json)" \
            --data-urlencode "message=$(jq -r .message build/badges/complexity.json)" \
            --data-urlencode "color=$(jq -r .color build/badges/complexity.json)" \
            -o build/badges/complexity.svg

      - name: Publish badges
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: build/badges
          commit_message: "Update quality badges"