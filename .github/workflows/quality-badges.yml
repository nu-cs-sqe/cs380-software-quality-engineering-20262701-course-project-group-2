name: Quality badges

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate JaCoCo and PIT badge data
        run: ./gradlew complexityBadge mutationBadge

      - name: Render badge SVGs
        run: |
          for badge in complexity mutation; do
            curl -fsSL -G "https://img.shields.io/static/v1" \
              --data-urlencode "label=$(jq -r .label build/badges/$badge.json)" \
              --data-urlencode "message=$(jq -r .message build/badges/$badge.json)" \
              --data-urlencode "color=$(jq -r .color build/badges/$badge.json)" \
              -o build/badges/$badge.svg
          done

      - name: Publish badges
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: build/badges
          commit_message: "Update quality badges"